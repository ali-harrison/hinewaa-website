<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f2eee6" />
    <title>Page not found | Hinewaa</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
    <!-- Static page served by Vercel for unknown paths; colours match src/styles/variables.css -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        background: #f2eee6;
        color: #15130f;
        font-family: 'Satoshi', system-ui, -apple-system, sans-serif;
      }

      main {
        width: 100%;
        max-width: 1240px;
        margin: 0 auto;
      }

      .label {
        margin: 0 0 1.5rem;
        color: #6b645a;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 1.25rem;
        font-size: clamp(2.75rem, 6.4vw, 5.75rem);
        font-weight: 500;
        line-height: 1;
        letter-spacing: -0.03em;
      }

      p {
        max-width: 32rem;
        margin: 0 0 2.5rem;
        color: #3d3832;
        font-size: 1.0625rem;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.9rem 1.5rem;
        border-radius: 100px;
        background: #15130f;
        color: #f2eee6;
        font-weight: 500;
        text-decoration: none;
        transition: background-color 0.3s ease;
      }

      a:hover {
        background: #9e321e;
      }

      a:focus-visible {
        outline: 2px solid #9e321e;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">404</p>
      <h1>Page not found.</h1>
      <p>The page you were looking for has moved or doesn't exist.</p>
      <a href="/">Back to Hinewaa <span aria-hidden="true">→</span></a>
    </main>
  </body>
</html>
